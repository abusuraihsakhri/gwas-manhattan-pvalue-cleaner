name: GWAS validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Python compile
        run: python -m compileall -q agents gwas_cleaner.py cli.py enrichment.py simulator.py
      - name: Python tests
        run: python -m pytest -q
      - name: Browser syntax and interaction smoke test
        if: matrix.python-version == '3.12'
        run: node tests/browser_smoke.cjs
