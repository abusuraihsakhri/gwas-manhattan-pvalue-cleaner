version: '3.8'

services:
  gwas-manhattan-pvalue-cleaner:
    build: .
    container_name: gwas-manhattan-pvalue-cleaner
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=gwas-manhattan-pvalue-cleaner-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
